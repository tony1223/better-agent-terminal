[package]
name = "better-agent-terminal"
version = "0.1.0"
description = "Better Agent Terminal — Tauri shell"
authors = ["TonyQ CO., LTD."]
edition = "2021"
default-run = "better-agent-terminal"

[lib]
# Desktop and headless binaries link this crate as an rlib. Building cdylib and
# staticlib here made every release also link unused ~20 MB/~250 MB library
# artifacts. Add the mobile-specific crate types back when a mobile target is
# introduced; none of the current desktop/server targets consume them.
name = "better_agent_terminal_lib"
crate-type = ["rlib"]

# The desktop shell (GUI). It also handles `--bat-server` mode when launched
# with the flag, but it links the full Tauri/Wry stack, so it cannot build
# without `desktop` — `required-features` excludes it from `--no-default-features`
# headless builds (otherwise `main.rs`'s `run()` would fail to compile there).
[[bin]]
name = "better-agent-terminal"
path = "src/main.rs"
required-features = ["desktop"]

# Dedicated headless RemoteServer entry. Built GUI-free with
# `--no-default-features --features headless` (links no tauri/wry/webkit) for
# enterprise Linux hosts (issue #117). It also builds under `desktop`, so the
# desktop bundle keeps shipping a `bat-server` alongside the GUI binary.
[[bin]]
name = "bat-server"
path = "src/bin/bat-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the app version out of tauri.conf.json for `BAT_APP_VERSION`; already
# built for the host target as a tauri-build dependency, so it costs nothing.
serde_json = "1"

# The Tauri/Wry desktop stack is optional and gated behind the `desktop`
# feature (on by default). A `--no-default-features` build links no tauri/wry
# and therefore no webkit2gtk — the path to a GUI-free `bat-server` for
# headless Linux hosts (issue #117). The headless build is being stood up
# incrementally; until it lands, every supported build keeps `desktop` on.
[dependencies]
tauri = { version = "2", features = [], optional = true }
# Direct tokio dep backs the headless async runtime (crate::async_rt); on desktop
# the shim re-exports tauri's bundled runtime, so this is only load-bearing headless.
tokio = { version = "1", features = ["rt-multi-thread", "rt", "sync", "time", "io-util", "process", "net"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
libc = "0.2"
base64 = "0.22"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
flate2 = "1"
pbkdf2 = "0.12"
sha1 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = "4.0.0"
keyring-core = "1.0.0"
notify = "8"
get_if_addrs = "0.5"
# Cross-platform PTY (Unix pty + Windows ConPTY). Tauri itself doesn't ship
# this; we keep the renderer-side shape identical to the Electron preload's
# pty.* surface and let a reader thread emit pty:output / pty:exit events.
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = "0.29.0"
rcgen = "0.14.8"
rand = "0.10.1"
sha2 = "0.10"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[dev-dependencies]
# portable-pty exposes anyhow::Result in its public mockable traits. Keep this
# test-only direct dependency so PTY lifecycle regression fakes can implement
# MasterPty without pulling anyhow into the production dependency surface.
anyhow = "1"

# We keep the application small for the first release: the host commands we
# expose are read/write JSON config files in the per-user data directory and
# open external URLs. Heavy lifting (PTY, agent SDK) stays in the Node
# sidecar plan documented in plans/tauri-migration-plan.md.

[features]
# `desktop` pulls the full Tauri/Wry shell (default). Building with
# `--no-default-features` (optionally `--features headless`) drops the tauri
# stack so the resulting `bat-server` links no webkit2gtk and runs on
# enterprise Linux without a display server. The headless build target is
# being assembled batch by batch; code paths that still require Tauri are
# migrated behind `host_context::HostContext` first.
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-notification",
]
headless = []

[profile.release]
# This buys nothing, and the premise it was added on was wrong. The original
# note here justified 256 by "32-core Windows / macOS runners"; this is a public
# repo, so CI runs on GitHub's standard runners — 4 vCPU on windows-latest,
# ubuntu and macos-*-intel, and 3 on macos-14. There is no 32-way parallelism to
# spend the extra codegen units on.
#
# Measured, reproducing CI's conditions (deps pinned so only our crate rebuilds,
# which is all CI ever compiles; -j 4 to match a standard runner), 3 runs each:
#   codegen-units=16   avg 178.3s  (175.7, 181.6, 177.6)
#   codegen-units=256  avg 182.1s  (181.4, 180.4, 184.4)
# 256 came out 2.1% SLOWER — inside the run-to-run spread either way, so the
# honest reading is "no difference", certainly not a win.
#
# It is left at 256 only because changing [profile.release] invalidates all
# seven rust-cache target dirs (4.37 GB), costing one ~30-minute release to save
# ~4 seconds thereafter. Drop the line and take the default the next time the
# caches are being invalidated anyway — a Cargo.lock change or a toolchain bump.
codegen-units = 256
# Drop debug symbols from the shipped binary. Smaller .exe / .dmg, no
# compile-time cost.
strip = "symbols"

# DO NOT re-add `[profile.release.package.better-agent-terminal] opt-level = "z"`
# without measuring on CI first. It was added on v3.1.54-pre.2 and reverted the
# same day, because it made CI builds roughly 2.2x SLOWER, not 33% faster.
#
# The local benchmark that justified it (3 interleaved reps, non-overlapping
# ranges: opt-level 3 = 196.9s, "z" = 131.9s, on a 16-core Windows box at -j 4)
# was simply not measuring what CI does. CI does the same nominal work — every
# dependency restored from cache, only this crate rebuilt — in 94s on a 4-vCPU
# runner. A 16-core box cannot be 2x slower at identical work, so the benchmark
# was compiling more than CI compiles, and its ranking cannot be trusted either.
#
# What CI actually measured, with the Rust source BYTE-IDENTICAL between the two
# tags (the only other commit in between, 2b1fbf9, touches renderer TSX/CSS/JSON
# and not one .rs file) and a full cache hit on both sides:
#                          opt-level 3      opt-level "z"
#   windows-latest            94s              206s
#   macos-14 (cargo phase)    35s               89s
# Two platforms, same direction, same factor. Not runner noise — for scale, the
# mac dmg bundling step varied 41s -> 61s in the same pair, and opt-level cannot
# touch hdiutil.
#
# The mechanism is unsurprising in hindsight: "z" optimises for SIZE, which drops
# the inline threshold to near zero. Less inlining means more functions survive as
# distinct entities through the whole LLVM pipeline, so there is *more* to codegen,
# not less — and with codegen-units = 256 that work is spread over more units.
# Optimising for size is not optimising for compile time.
#
# It did shrink the Windows lightweight installer 34.1 -> 31.3 MB. That is not
# worth doubling every release's critical path.
#
# The second thing that release taught, worth keeping because it constrains every
# future attempt: ANY new or removed table in this file is a cache miss. Swatinem/
# rust-cache derives its GHA key from `JSON.stringify(toml.parse(Cargo.toml))`
# (config.ts) — the whole parsed manifest, not just the dependency sections. So
# adding the profile table cost one release a full 806-dependency rebuild:
#   v3.1.54-pre.1   cache hit     94s
#   v3.1.54-pre.2   cache miss   908s
# Verified by reproducing that hashing against this exact manifest. What it does
# NOT include: comments (TOML parsing drops them) and package.version (normalised
# to "0.0.0"). So editing this comment block, or bumping the version, is free —
# which is why the revert above restores the pre-change key exactly and rehits the
# still-live -8d9ddd59 cache entries instead of paying the rebuild twice.
#
# That is also the standing reason codegen-units stays at 256: dropping it is
# another full-rebuild release to save ~4 seconds. Bundle it with whatever
# invalidates the caches next — a Cargo.lock change or a toolchain bump.
#
# Structural facts about this build that survive the retraction, since they came
# from separate measurements and none of them point at opt-level: the front end is
# a rounding error (the whole 34k-line crate `cargo check`s in 4.5s, so line count
# is not a lever), and more cores do not help (-j 1/2/4/8/16 spanned only
# 184/170/153/163/170s, peaking at 4 — the standard runner's width already). Both
# came off the same local harness whose absolute numbers CI contradicts, so treat
# them as directions, not values.
