[package]
name = "bat-filesystem"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bat-host-support = { path = "../bat-host-support", default-features = false }
base64 = "0.22"
notify = "8"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
