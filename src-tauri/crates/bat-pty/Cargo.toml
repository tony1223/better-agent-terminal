[package]
name = "bat-pty"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bat-app-storage = { path = "../bat-app-storage" }
bat-host-support = { path = "../bat-host-support", default-features = false }
libc = "0.2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# portable-pty's mockable traits return anyhow::Result.
anyhow = "1"
