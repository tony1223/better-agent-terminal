[package]
name = "bat-host-support"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = "0.1"
get_if_addrs = "0.5"
keyring-core = "1.0.0"
pbkdf2 = "0.12"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.0.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
